<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f3f0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #2c2c2c;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 40px 36px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .sub {
            color: #888;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .tag-list {
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background: #f0ebe6;
            border-radius: 30px;
            padding: 2px 14px;
            font-size: 13px;
            color: #555;
            margin-right: 6px;
            margin-bottom: 4px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin: 28px 0 14px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #eee;
        }

        .item {
            background: #f9f7f5;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 10px;
        }

        .item .title {
            font-weight: 600;
            font-size: 16px;
        }

        .item .desc {
            font-size: 14px;
            color: #666;
            margin-top: 2px;
        }

        .social-item {
            background: #f9f7f5;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-item .label {
            font-weight: 500;
            font-size: 15px;
        }

        .social-item .value {
            font-size: 14px;
            color: #555;
            background: white;
            padding: 2px 14px;
            border-radius: 20px;
            border: 1px solid #e0d8d0;
        }

        .btn {
            background: #2c2c2c;
            border: none;
            color: white;
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 500;
        }

        .btn:hover {
            background: #111;
            transform: scale(0.96);
        }

        .btn.copied {
            background: #4a7a5c;
        }

        .btn-link {
            display: inline-block;
            background: #2c2c2c;
            color: white;
            padding: 5px 20px;
            border-radius: 40px;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
            border: none;
            cursor: pointer;
        }

        .btn-link:hover {
            background: #111;
            transform: scale(0.96);
        }

        .btn-link.outline {
            background: transparent;
            color: #2c2c2c;
            border: 1.5px solid #d4c5b2;
        }

        .btn-link.outline:hover {
            background: #f0ebe6;
        }

        .about-box {
            background: #f9f7f5;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 14px;
            line-height: 1.8;
            color: #444;
        }

        .about-box strong {
            color: #1a1a1a;
        }

        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 18px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 24px 16px;
            }
            .social-item {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ===== 标题 ===== -->
    <h1>HA</h1>
    <div class="sub">你好，我是HA</div>
  <div class="sub">如下是我借助AI做的工具</div>
  <div class="section-title">工具</div>

    <div class="item">
        <div class="title">架空站名/地名生成器</div>
        <div class="desc">基于全国站名/地名字频统计，实现的一键生成合理可直接使用的架空站名</div>
        <div style="margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap;">
            <a href="generated.html" class="btn-link" target="_blank">前往使用</a>
            <a href="https://github.com/HA456-max/HAtool" class="btn-link outline" target="_blank">github源代码</a>
        </div>
    </div>
  <div style="font-size: 14px; color: #999; margin: 4px 0 0 4px;">还有没了，以后再说</div>
  <div class="footer">© HA</div>
</div>
</body>
</html>
